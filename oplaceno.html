<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Проверяем оплату — Академический Салон</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<link rel="stylesheet" href="assets/fonts/fonts.css?v=20260724seo2" />
<link rel="stylesheet" href="assets/css/styles.css?v=20260726release24" />
<link rel="stylesheet" href="assets/css/polish15-operations.css?v=20260726release24" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<meta name="theme-color" content="#F6F1E7" />
<script>(function(){try{var t=localStorage.getItem("salon_theme");if(!t&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body class="p15-operations p15-system p15-standalone">
<main class="p15-operations system-page system-page--payment" id="main">
  <section class="system-card">
    <div class="system-card__mark is-loading">
      <img src="bimi/logo.svg" alt="">
      <i aria-hidden="true"></i>
    </div>
    <p class="eyebrow">Проверка оплаты</p>
    <h1>Проверяем статус операции.</h1>
    <p id="opText">Не повторяйте платёж. После ответа кассы откроется нужное дело или оплаченная услуга.</p>
    <div class="system-card__facts">
      <span><small>Статус</small><strong>запрашивается</strong></span>
      <span><small>Повторный платёж</small><strong>не нужен</strong></span>
      <span><small>Подтверждение</small><strong>на сервере</strong></span>
    </div>
    <div class="system-card__actions">
      <a class="button button--primary" href="dashboard.html">Открыть кабинет <span aria-hidden="true">→</span></a>
      <a class="button button--text" href="priyomnaya.html">Сообщить о проблеме</a>
    </div>
  </section>
</main>
<script>
(function () {
  'use strict';
  function query(name) {
    var match = (location.search || '').match(new RegExp('[?&]' + name + '=([^&]+)'));
    if (!match) return '';
    try { return decodeURIComponent(match[1].replace(/\+/g, ' ')); }
    catch (error) { return ''; }
  }
  var offer = query('Shp_k');
  var gift = query('Shp_gift');
  var kind = query('Shp_kind');
  var order = query('Shp_order');
  var target = '';
  if (kind === 'tip' && order) target = 'dashboard.html?thanks=' + encodeURIComponent(order);
  else if (offer) target = 'zayavka.html#k=' + encodeURIComponent(offer);
  else if (gift) target = 'gift.html?code=' + encodeURIComponent(gift);
  else if (kind === 'sub') target = 'dashboard.html#plus';
  else if (order) target = 'dashboard.html?paid=' + encodeURIComponent(order);

  if (!target) {
    document.getElementById('opText').textContent =
      'Откройте кабинет: статус изменится только после серверного подтверждения кассы. Если оплата ещё не видна, обновите страницу через минуту.';
    return;
  }
  try { location.replace(target); }
  catch (error) { location.href = target; }
})();
</script>
<noscript><p style="position:fixed;right:16px;bottom:16px;left:16px;text-align:center">Откройте <a href="dashboard.html">кабинет</a>: статус изменится после подтверждения кассы.</p></noscript>
</body>
</html>
