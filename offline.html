<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#EFE5D6" />
<meta name="robots" content="noindex" />
<title>Нет сети — Академический Салон</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" /><link rel="manifest" href="/manifest.webmanifest?v=20260806shell122" /><meta name="mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="default" /><meta name="apple-mobile-web-app-title" content="Академсалон" />
<style>
  /* Страница обязана открываться без сети, поэтому стили лежат прямо здесь:
     внешний файл может не оказаться в кэше. Шрифты — системные по той же
     причине, фирменные подгружаются с сети. */
  :root{
    --paper:#E9DDCC; --sheet:#FFF9F0; --ink:#22201B; --ink-soft:#6B665A;
    --wax:#A63F29; --hairline:#D9D2C2;
    color-scheme:light dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh; display:grid; place-items:center;
    padding:24px max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    background:var(--paper); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  .sheet{
    width:min(100%,420px); padding:28px 22px 24px; text-align:center;
    background:var(--sheet); border:1px solid var(--hairline); border-radius:3px;
    box-shadow:0 18px 46px rgba(26,18,13,.14);
  }
  .seal{
    width:64px; height:64px; margin:0 auto 18px; display:grid; place-items:center;
    border-radius:50%; background:var(--wax); color:#FFF9F0;
    font:600 22px/1 Georgia,"Times New Roman",serif; letter-spacing:.04em;
    box-shadow:0 0 0 1px rgba(140,45,24,.35), 0 4px 12px rgba(78,43,29,.24);
  }
  h1{margin:0 0 10px; font:400 24px/1.22 Georgia,"Times New Roman",serif}
  p{margin:0 0 8px; font-size:16px; color:var(--ink-soft)}
  .note{margin-top:16px; font-size:14px}
  button{
    margin-top:20px; min-height:48px; width:100%; padding:12px 18px;
    font:inherit; font-size:16px; color:#FFF9F0; background:var(--wax);
    border:0; border-radius:2px; cursor:pointer;
  }
  button:active{transform:scale(.99)}
  @media (prefers-color-scheme:dark){
    :root{--paper:#181411; --sheet:#221D19; --ink:#F5EFE4; --ink-soft:#B9B0A2; --hairline:#3A342C}
    .sheet{box-shadow:0 18px 46px rgba(0,0,0,.5)}
  }
</style>
</head>
<body>
  <main class="sheet">
    <div class="seal" aria-hidden="true">АС</div>
    <h1>Сети нет</h1>
    <p>Телефон сейчас без интернета, поэтому страница не открылась.</p>
    <p class="note">Ваши черновики и сохранённый подбор никуда не делись — они остались на этом устройстве и будут на месте, когда связь вернётся.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
  </main>
</body>
</html>
