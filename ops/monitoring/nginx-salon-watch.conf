# Akademsalon production monitoring contract (2026-08-20).
#
# These directives belong inside the canonical TLS `server` for
# `akademsalon.ru`. The `noqs` format is defined in `/etc/nginx/nginx.conf` and
# intentionally omits client IP, user agent, referrer and query strings.

access_log /var/log/nginx/akademsalon-watch.log noqs;

# Akademsalon is a static HTML application with explicit `/api/` proxy routes.
# A PHP-looking path is therefore always a scanner probe. Reject it locally so
# it can never inherit a future catch-all upstream or expose an accidentally
# uploaded server-side file as static text.
location ~* \.php(?:/|$) {
    return 404;
}
